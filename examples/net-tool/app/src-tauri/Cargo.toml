[package]
name = "net-tool"
version = "0.1.0"
description = "A TCP and UDP tool on rack42u, Tauri 2, and Quasar"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
