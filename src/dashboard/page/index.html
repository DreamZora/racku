<!doctype html>
<!--
  The dashboard's page, which rack dashboard serves with Bun's HTML imports. Bun bundles the
  script and the stylesheet that it names. The policy below lets it load only those, and send
  requests only to the dashboard; Bun's HTML imports send no headers of the dashboard's own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>racku dashboard</title>
<!-- An empty icon, so that the browser asks the dashboard for no /favicon.ico. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./main.ts"></script>
</head>
<body>
<main id="app"></main>
</body>
</html>
